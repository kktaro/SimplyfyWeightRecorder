name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Banned APIs
        run: scripts/check-banned-apis.sh

      # verifyRoborazziDebug はユニットテスト全体を走らせ、スクリーンショットを
      # app/src/test/screenshots/ と比較する。instrumented テストはエミュレータが必要なため、コンパイルのみ確認する
      - name: Unit + screenshot tests, lint, androidTest compile
        run: ./gradlew verifyRoborazziDebug lintDebug assembleDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
